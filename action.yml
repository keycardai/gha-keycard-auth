name: Keycard Auth
description: Exchange a GitHub Actions OIDC token for credentials via Keycard STS.
author: Keycard Labs, Inc.

branding:
  icon: shield
  color: purple

inputs:
  zone-url:
    description: Base URL of the Keycard zone (e.g., https://<id>.keycard.cloud).
    required: true
  audience:
    description: Audience to request in the GHA OIDC token. Defaults to zone-url.
    required: false
  credentials:
    description: |
      YAML list of credentials to fetch. Each entry:
        - resource: <urn>                # required, Keycard resource identifier
          type: env | file | <provider>  # required; see README for provider list
          scope: <scope>                 # optional, OAuth scope to request on the resource
          env-name: <NAME>               # required when type=env; optional override for provider types
          file-path: <path>              # required when type=file
          file-mode: "0600"              # optional, default 0600. Must be quoted.
          <provider>:                    # required when type=<provider>; see README for fields
            ...
    required: true
  allow-failure:
    description: |
      Break-glass. When "true", any failure during discovery, OIDC mint,
      token exchange, or credential application is logged as a warning
      and the step exits successfully (no credentials exported). The
      default is "false", which fails the step on any error.

      Intended for declared Keycard outages where a downstream step can
      detect the absence of the expected credential (e.g. PULUMI_ACCESS_TOKEN
      unset) and route to an alternate auth path. Do not enable in
      steady state — it suppresses legitimate authorization decisions
      (e.g. Keycard rejecting a request) along with availability errors.
    required: false
    default: "false"

runs:
  using: node24
  main: dist/index.js
  post: dist/post/index.js
