name: Keycard Auth
description: Exchange a GitHub Actions OIDC token for credentials via Keycard STS.
author: Keycard Labs, Inc.

branding:
  icon: shield
  color: purple

inputs:
  zone-url:
    description: Base URL of the Keycard zone (e.g., https://<id>.keycard.cloud).
    required: true
  audience:
    description: Audience to request in the GHA OIDC token. Accepts any string. For a workload identity credential, must match allowed_audience if set, or the Zone issuer otherwise. Legacy credentials do not enforce allowed_audience. When omitted, defaults to the Zone issuer (zone-url, for example https://<zone-id>.keycard.cloud).
    required: false
  client-id:
    description: Client ID of the workload identity credential. Omit for a legacy credential. An empty value counts as omitted and selects legacy matching.
    required: false
  credentials:
    description: |
      YAML list of credentials to fetch. Each entry:
        - resource: <urn>                # required, Keycard resource identifier
          type: env | file | <provider>  # required; see README for provider list
          scope: <scope>                 # optional, OAuth scope to request on the resource
          env-name: <NAME>               # required when type=env; optional override for provider types
          file-path: <path>              # required when type=file
          file-mode: "0600"              # optional, default 0600. Must be quoted.
          <provider>:                    # required when type=<provider>; see README for fields
            ...
    required: true

runs:
  using: node24
  main: dist/index.js
  post: dist/post/index.js
