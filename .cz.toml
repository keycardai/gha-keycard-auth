[tool.commitizen]
name = "cz_customize"
version = "0.3.0"
version_files = ['package.json:"version"']
tag_format = "v${version}"
update_changelog_on_bump = true
bump_message = "bump: gha-keycard-auth $current_version → $new_version"
major_version_zero = true

[tool.commitizen.customize]
changelog_pattern = '^((feat|fix|refactor|perf|test|build|ci|revert)(\(.+\))?|chore\(deps\))(!)?:'
bump_pattern = '^((BREAKING[- ]CHANGE|\w+)(\(.+\))?!?):'

[tool.commitizen.customize.bump_map]
'^.+!$' = "MAJOR"
'^BREAKING[- ]CHANGE' = "MAJOR"
'^feat' = "MINOR"
'^fix' = "PATCH"

[tool.commitizen.customize.bump_map_major_version_zero]
'^.+!$' = "MINOR"
'^BREAKING[- ]CHANGE' = "MINOR"
'^feat' = "MINOR"
'^fix' = "PATCH"
