name: Acceptance tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure acceptance fixtures
        id: provision
        timeout-minutes: 10
        run: bash acceptance/zone.sh up
        env:
          KEYCARD_CLIENT_ID: ${{ secrets.KEYCARD_CLIENT_ID }}
          KEYCARD_CLIENT_SECRET: ${{ secrets.KEYCARD_CLIENT_SECRET }}
          KEYCARD_TOKEN_ENDPOINT: ${{ vars.KEYCARD_TOKEN_ENDPOINT }}
          KEYCARD_API_URL: ${{ vars.KEYCARD_API_URL }}
          KEYCARD_ZONE_ID: ${{ vars.KEYCARD_ZONE_ID }}

      - name: Exchange with v1 credential
        uses: ./
        with:
          zone-url: ${{ steps.provision.outputs.zone_issuer }}
          credentials: |
            - resource: ${{ steps.provision.outputs.resource_identifier }}
              type: env
              env-name: ACCEPTANCE_V1_TOKEN

      - name: Check v1 token
        run: node acceptance/assert-token.mjs
        env:
          ACCEPTANCE_TOKEN: ${{ env.ACCEPTANCE_V1_TOKEN }}
          EXPECTED_ISSUER: ${{ steps.provision.outputs.zone_issuer }}
          EXPECTED_RESOURCE: ${{ steps.provision.outputs.resource_identifier }}
