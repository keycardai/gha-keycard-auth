name: Merge to Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  prepare:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    uses: ./.github/workflows/release-prepare.yml
    with:
      attempt: 1

  push:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-push.yml
    with:
      attempt: 1
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      SDK_RELEASE_PRIVATE_KEY: ${{ secrets.SDK_RELEASE_PRIVATE_KEY }}

  prepare-retry:
    needs: push
    if: needs.push.outputs.retry == 'true'
    uses: ./.github/workflows/release-prepare.yml
    with:
      attempt: 2

  push-retry:
    needs: prepare-retry
    if: needs.prepare-retry.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-push.yml
    with:
      attempt: 2
      tag: ${{ needs.prepare-retry.outputs.tag }}
    secrets:
      SDK_RELEASE_PRIVATE_KEY: ${{ secrets.SDK_RELEASE_PRIVATE_KEY }}

  prepare-final:
    needs: push-retry
    if: needs.push-retry.outputs.retry == 'true'
    uses: ./.github/workflows/release-prepare.yml
    with:
      attempt: 3

  push-final:
    needs: prepare-final
    if: needs.prepare-final.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-push.yml
    with:
      attempt: 3
      tag: ${{ needs.prepare-final.outputs.tag }}
      final: true
    secrets:
      SDK_RELEASE_PRIVATE_KEY: ${{ secrets.SDK_RELEASE_PRIVATE_KEY }}
