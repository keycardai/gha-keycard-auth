name: Push Release

on:
  workflow_call:
    inputs:
      attempt:
        type: number
        required: true
      tag:
        type: string
        required: true
      final:
        type: boolean
        default: false
    secrets:
      SDK_RELEASE_PRIVATE_KEY:
        required: true
    outputs:
      retry:
        value: ${{ jobs.push.outputs.retry }}

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    outputs:
      retry: ${{ steps.push.outputs.retry }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ inputs.attempt }}
          path: ${{ runner.temp }}/prepared-release

      - name: Generate GitHub App token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SDK_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDK_RELEASE_PRIVATE_KEY }}

      - name: Push release
        id: push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: https://github.com/${{ github.repository }}.git
          FINAL_ATTEMPT: ${{ inputs.final }}
        run: |
          status=0
          python scripts/bump.py push "$RUNNER_TEMP/prepared-release/release.bundle" || status=$?
          if [ "$status" -eq 75 ] && [ "$FINAL_ATTEMPT" != true ]; then
            echo 'retry=true' >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi
