name: Bump Version

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Optional version increment
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - run: pip install commitizen==4.19.2

      - name: Open the bump PR
        run: python scripts/bump.py --increment "$INCREMENT"
        env:
          INCREMENT: ${{ inputs.increment }}
          GH_TOKEN: ${{ github.token }}
