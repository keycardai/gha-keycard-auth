name: Prepare Release

on:
  workflow_call:
    inputs:
      attempt:
        type: number
        required: true
    outputs:
      tag:
        value: ${{ jobs.prepare.outputs.tag }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install commitizen==4.19.2

      - name: Prepare release
        id: prepare
        run: python scripts/bump.py prepare "$RUNNER_TEMP/release.bundle"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare.outputs.tag != ''
        with:
          name: release-${{ inputs.attempt }}
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 1
